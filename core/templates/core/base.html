<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shahmeer's MindPulse AI OS</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --sidebar-width: 260px;
        }
        body { 
            background-color: #f8fafc; 
            overflow-x: hidden; 
            font-family: system-ui, -apple-system, sans-serif; 
            margin: 0;
        }
        
        /* Sidebar Professional Slide Styling */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            width: var(--sidebar-width);
            background: #0f172a;
            color: white;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1050;
            box-shadow: 4px 0 15px rgba(0,0,0,0.05);
        }
        .sidebar.collapsed {
            transform: translateX(calc(var(--sidebar-width) * -1));
        }
        .sidebar a {
            color: #94a3b8;
            text-decoration: none;
            padding: 14px 22px;
            display: flex;
            align-items: center;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            border-left: 4px solid transparent;
        }
        .sidebar a:hover, .sidebar a.active {
            color: #ffffff;
            background: #1e293b;
            border-left-color: #3b82f6;
        }

        /* Main Content Wrapper Smooth Transition */
        .main-content {
            margin-left: var(--sidebar-width);
            transition: margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .main-content.expanded {
            margin-left: 0 !important;
        }

        /* Top Sticky Navbar */
        .top-navbar {
            background: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
            width: 100%;
        }
        .toggle-btn {
            background: #2563eb;
            border: none;
            color: #ffffff;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
            box-shadow: 0 2px 5px rgba(37, 99, 235, 0.2);
        }
        .toggle-btn:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>

    <!-- Sidebar Navigation -->
    <div class="sidebar d-flex flex-column" id="sidebar">
        <div class="p-4 border-bottom border-secondary border-opacity-25 text-center">
            <h5 class="fw-bold text-white mb-0"><i class="fa-solid fa-brain text-primary me-2"></i>Shahmeer's OS</h5>
            <small class="text-muted" style="font-size: 0.75rem;">Productivity & Neural Core</small>
        </div>
        <div class="mt-3 flex-grow-1">
            <a href="{% url 'dashboard' %}" class="{% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}"><i class="fa-solid fa-chart-pie me-3"></i> Dashboard</a>
            <a href="{% url 'neural_quests' %}" class="{% if request.resolver_match.url_name == 'neural_quests' %}active{% endif %}"><i class="fa-solid fa-wand-magic-sparkles me-3"></i> Neural Quests</a>
            <a href="{% url 'tasks' %}" class="{% if request.resolver_match.url_name == 'tasks' %}active{% endif %}"><i class="fa-solid fa-list-check me-3"></i> Task Manager</a>
            <a href="{% url 'videos' %}" class="{% if request.resolver_match.url_name == 'videos' %}active{% endif %}"><i class="fa-solid fa-video me-3"></i> Media Vault</a>
        </div>
        <div class="p-3 border-top border-secondary border-opacity-25 text-center">
            <small class="text-muted">Status: <span class="text-success fw-bold">Active</span></small>
        </div>
    </div>

    <!-- Main Content Area -->
    <div class="main-content" id="mainContent">
        <!-- Top Sticky Navbar with Slide Toggle -->
        <div class="top-navbar shadow-sm">
            <button class="toggle-btn" id="sidebarToggle" title="Toggle Sidebar">
                <i class="fa-solid fa-bars me-1"></i> Menu
            </button>
            <div class="d-flex align-items-center">
                <span class="badge bg-primary bg-opacity-10 text-primary px-3 py-2 rounded-pill fw-bold">
                    <i class="fa-solid fa-user-shield me-1"></i> {{ request.user.get_full_name|default:request.user.username|title }}
                </span>
            </div>
        </div>

        <!-- Page Dynamic Body Content -->
        <div class="p-4 flex-grow-1">
            {% block content %}{% endblock %}
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const sidebar = document.getElementById('sidebar');
        const mainContent = document.getElementById('mainContent');
        const sidebarToggle = document.getElementById('sidebarToggle');

        sidebarToggle.addEventListener('click', () => {
            sidebar.classList.toggle('collapsed');
            mainContent.classList.toggle('expanded');
        });
    </script>
</body>
</html>
